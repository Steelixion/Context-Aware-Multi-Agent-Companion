[project]
name = "driver-companion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20",
  "lancedb>=0.13",
  "pydantic>=2.7",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "cryptography>=42",
  "langgraph>=0.2",
]
[project.optional-dependencies]
vision = ["mediapipe", "opencv-python", "torch", "numpy"]
audio = ["faster-whisper", "piper-tts", "onnxruntime"]
